[package]
name = "agenticenti"
version = "0.1.0"
edition = "2021"
description = "Composable agent prompt CLI"

[lib]
name = "agenticenti"
path = "src/lib.rs"

[[bin]]
name = "agenticenti"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
